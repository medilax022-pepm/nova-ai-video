<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova AI | Video Generation Studio</title>
    <!-- CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Alpine.js moves to bottom for safety -->

    <style>
        [x-cloak] { display: none !important; }
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #fafafa; }
        .glass-header { background: rgba(9, 9, 11, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid #27272a; }
        .card-dark { background: #18181b; border: 1px solid #27272a; }
        .shimmer {
            background: linear-gradient(90deg, #18181b 25%, #27272a 50%, #18181b 75%);
            background-size: 200% 100%;
            animation: shimmer 2s infinite linear;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body x-data="novaApp()" x-init="initApp()" class="min-h-screen flex overflow-hidden">

    <!-- SIDEBAR -->
    <aside class="w-64 border-r border-zinc-800 bg-zinc-950 flex flex-col hidden md:flex shrink-0">
        <div class="p-6 flex items-center gap-3">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center">
                <i data-lucide="sparkles" class="text-white w-5 h-5"></i>
            </div>
            <span class="text-xl font-bold tracking-tight text-white">Nova AI</span>
        </div>

        <nav class="flex-1 px-4 space-y-1">
            <button @click="changeView('generator')" :class="view === 'generator' ? 'bg-zinc-900 text-white' : 'text-zinc-400'" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg hover:text-white transition">
                <i data-lucide="layout-grid" class="w-4 h-4"></i> Generator
            </button>
            <button @click="changeView('history')" :class="view === 'history' ? 'bg-zinc-900 text-white' : 'text-zinc-400'" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg hover:text-white transition">
                <i data-lucide="video" class="w-4 h-4"></i> My Videos
            </button>
            <button class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-zinc-400 hover:text-white transition">
                <i data-lucide="credit-card" class="w-4 h-4"></i> Billing
            </button>
        </nav>

        <div class="p-4 m-4 rounded-xl card-dark">
            <p class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest mb-1">Available Credits</p>
            <div class="flex justify-between items-end">
                <div>
                    <span class="text-2xl font-bold text-white" x-text="user ? credits : '0'"></span>
                    <span class="text-xs text-zinc-600">/ 500</span>
                </div>
                <button class="text-xs text-indigo-400 font-semibold hover:underline">Top up</button>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="flex-1 flex flex-col relative overflow-hidden">
        
        <!-- TOP NAV -->
        <header class="h-16 flex items-center justify-between px-8 glass-header sticky top-0 z-40">
            <h2 class="text-xs font-bold text-zinc-500 uppercase tracking-widest" x-text="view === 'generator' ? 'Video Studio' : 'Your History'"></h2>

            <div class="flex items-center gap-4">
                <template x-if="!user">
                    <div class="flex items-center gap-3">
                        <button @click="showLogin = true" class="text-sm font-medium text-zinc-400 hover:text-white transition">Login</button>
                        <button @click="showLogin = true" class="bg-white text-black text-sm font-bold px-4 py-2 rounded-lg hover:bg-zinc-200 transition">Get Started</button>
                    </div>
                </template>

                <template x-if="user">
                    <div class="flex items-center gap-4">
                        <div class="flex items-center gap-3 border-r border-zinc-800 pr-4">
                            <div class="text-right hidden sm:block">
                                <p class="text-sm font-bold text-white" x-text="user.user_metadata.full_name || 'User'"></p>
                                <p class="text-[10px] text-zinc-500" x-text="user.email"></p>
                            </div>
                            <img :src="user.user_metadata.avatar_url || 'https://ui-avatars.com/api/?name=' + user.email" class="w-8 h-8 rounded-full">
                        </div>
                        <button @click="handleSignOut()" class="text-zinc-400 hover:text-red-400"><i data-lucide="log-out" class="w-5 h-5"></i></button>
                    </div>
                </template>
            </div>
        </header>

        <!-- CONTENT -->
        <main class="flex-1 overflow-y-auto p-8 bg-zinc-950">
            <!-- Generator -->
            <div x-show="view === 'generator'" class="max-w-5xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div class="lg:col-span-5 space-y-6">
                    <div class="space-y-3">
                        <label class="text-sm font-semibold text-zinc-300">Prompt Description</label>
                        <textarea x-model="prompt" class="w-full h-40 bg-zinc-900 border border-zinc-800 rounded-2xl p-4 text-sm outline-none focus:ring-1 focus:ring-indigo-500 transition" placeholder="Describe your video..."></textarea>
                    </div>
                    <button @click="generateVideo()" :disabled="loading" class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white font-bold rounded-2xl transition">
                        <span x-show="!loading">Generate Video (10cr)</span>
                        <span x-show="loading">Processing...</span>
                    </button>
                </div>
                <div class="lg:col-span-7">
                    <div class="relative w-full rounded-3xl border border-zinc-800 bg-zinc-900 aspect-video flex items-center justify-center overflow-hidden">
                        <div x-show="!loading && !generated" class="text-zinc-700 flex flex-col items-center">
                            <i data-lucide="video" class="w-12 h-12 mb-2 opacity-20"></i>
                            <span class="text-sm">Preview window</span>
                        </div>
                        <div x-show="loading" class="text-center">
                            <div class="w-48 h-1 bg-zinc-800 rounded-full overflow-hidden mb-2"><div class="shimmer h-full w-full"></div></div>
                            <p class="text-[10px] text-zinc-500 uppercase">Rendering...</p>
                        </div>
                        <template x-if="generated && !loading">
                            <video class="w-full h-full object-cover" autoplay loop muted src="https://assets.mixkit.co/videos/preview/mixkit-abstract-tunnel-of-blue-and-pink-neon-lights-31846-large.mp4"></video>
                        </template>
                    </div>
                </div>
            </div>

            <!-- History -->
            <div x-show="view === 'history'" x-cloak class="max-w-5xl mx-auto">
                <p class="text-zinc-500">Your generated videos will appear here.</p>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-6">
                    <template x-for="vid in videoHistory" :key="vid.id">
                        <div class="card-dark p-2 rounded-xl">
                            <video :src="vid.url" class="rounded-lg w-full aspect-video object-cover" muted></video>
                        </div>
                    </template>
                </div>
            </div>
        </main>
    </div>

    <!-- Login Modal -->
    <div x-show="showLogin" x-cloak class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/90 backdrop-blur-md">
        <div @click.away="showLogin = false" class="bg-zinc-950 border border-zinc-800 rounded-[2rem] max-w-md w-full p-10">
            <h2 class="text-xl font-bold mb-6">Sign in</h2>
            <button @click="handleGoogleLogin()" class="w-full flex items-center justify-center gap-3 bg-white text-black font-bold py-3 rounded-xl">
                Continue with Google
            </button>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        // Supabase Init
        const supabase = window.supabase.createClient(
            'https://qvuwznitvqruqmkkuecl.supabase.co', 
            'sb_publishable_lrwRx5E9AzmVpHbGhHQa3A_DOnlyV05'
        );

        function novaApp() {
            return {
                view: 'generator',
                user: null,
                credits: 120,
                videoHistory: [],
                showLogin: false,
                loading: false,
                generated: false,
                prompt: '',
                ratio: '16:9',

                async initApp() {
                    // Start icons
                    lucide.createIcons();

                    // Check session
                    const { data: { session } } = await supabase.auth.getSession();
                    this.user = session?.user || null;
                    
                    if(this.user) this.loadLocalData();

                    // Listen for auth
                    supabase.auth.onAuthStateChange((_event, session) => {
                        this.user = session?.user || null;
                        if(this.user) this.loadLocalData();
                        this.$nextTick(() => lucide.createIcons());
                    });
                },

                changeView(v) {
                    this.view = v;
                    this.$nextTick(() => lucide.createIcons());
                },

                loadLocalData() {
                    const saved = localStorage.getItem(`nova_${this.user.id}`);
                    if (saved) {
                        const data = JSON.parse(saved);
                        this.credits = data.credits;
                        this.videoHistory = data.history;
                    }
                },

                saveLocalData() {
                    if(!this.user) return;
                    localStorage.setItem(`nova_${this.user.id}`, JSON.stringify({
                        credits: this.credits,
                        history: this.videoHistory
                    }));
                },

                async handleGoogleLogin() {
                    await supabase.auth.signInWithOAuth({ provider: 'google' });
                },

                async handleSignOut() {
                    await supabase.auth.signOut();
                    window.location.reload();
                },

                generateVideo() {
                    if (!this.user) { this.showLogin = true; return; }
                    if (!this.prompt) return alert('Enter prompt');
                    
                    this.loading = true;
                    this.generated = false;

                    setTimeout(() => {
                        this.loading = false;
                        this.generated = true;
                        this.credits -= 10;
                        this.videoHistory.unshift({
                            id: Date.now(),
                            prompt: this.prompt,
                            url: 'https://assets.mixkit.co/videos/preview/mixkit-abstract-tunnel-of-blue-and-pink-neon-lights-31846-large.mp4',
                            timestamp: new Date()
                        });
                        this.saveLocalData();
                        this.$nextTick(() => lucide.createIcons());
                    }, 3000);
                }
            }
        }
    </script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>
