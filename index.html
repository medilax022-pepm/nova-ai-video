<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova AI | Video Studio</title>
    <!-- Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        [x-cloak] { display: none !important; }
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #fafafa; }
        .glass-header { background: rgba(9, 9, 11, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid #27272a; }
        .card-dark { background: #18181b; border: 1px solid #27272a; }
        .shimmer {
            background: linear-gradient(90deg, #18181b 25%, #27272a 50%, #18181b 75%);
            background-size: 200% 100%;
            animation: shimmer 2s infinite linear;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body x-data="novaApp()" x-init="initApp()" class="min-h-screen flex overflow-hidden">

    <!-- SIDEBAR -->
    <aside class="w-64 border-r border-zinc-800 bg-zinc-950 flex flex-col hidden md:flex shrink-0">
        <div class="p-6 flex items-center gap-3">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center">
                <i data-lucide="sparkles" class="text-white w-5 h-5"></i>
            </div>
            <span class="text-xl font-bold tracking-tight text-white">Nova AI</span>
        </div>

        <nav class="flex-1 px-4 space-y-1">
            <button @click="changeView('generator')" :class="view === 'generator' ? 'bg-zinc-900 text-white' : 'text-zinc-400'" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg hover:text-white transition">
                <i data-lucide="layout-grid" class="w-4 h-4"></i> Generator
            </button>
            <button @click="changeView('history')" :class="view === 'history' ? 'bg-zinc-900 text-white' : 'text-zinc-400'" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg hover:text-white transition">
                <i data-lucide="video" class="w-4 h-4"></i> My Videos
            </button>
            <button class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-zinc-400 hover:text-white transition">
                <i data-lucide="credit-card" class="w-4 h-4"></i> Billing
            </button>
        </nav>

        <div class="p-4 m-4 rounded-xl card-dark">
            <p class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest mb-1">Available Credits</p>
            <div class="flex justify-between items-end">
                <div>
                    <span class="text-2xl font-bold text-white" x-text="user ? credits : '0'"></span>
                    <span class="text-xs text-zinc-600">/ 500</span>
                </div>
                <button class="text-xs text-indigo-400 font-semibold hover:underline">Top up</button>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="flex-1 flex flex-col relative overflow-hidden bg-zinc-950">
        
        <!-- HEADER -->
        <header class="h-16 flex items-center justify-between px-8 glass-header sticky top-0 z-40">
            <h2 class="text-xs font-bold text-zinc-400 uppercase tracking-widest" x-text="view === 'generator' ? 'Video Studio' : 'Your History'"></h2>

            <div class="flex items-center gap-4">
                <!-- Logged Out Header Buttons -->
                <template x-if="!user">
                    <div class="flex items-center gap-4">
                        <button @click="openAuth('login')" class="text-sm font-medium text-zinc-400 hover:text-white transition">Login</button>
                        <button @click="openAuth('register')" class="bg-indigo-600 text-white text-sm font-bold px-4 py-2 rounded-lg hover:bg-indigo-500 transition shadow-lg shadow-indigo-600/20">Sign Up</button>
                    </div>
                </template>

                <!-- Logged In User Info -->
                <template x-if="user">
                    <div class="flex items-center gap-4" x-cloak>
                        <div class="flex items-center gap-3 border-r border-zinc-800 pr-4 text-right">
                            <div class="hidden sm:block">
                                <p class="text-sm font-bold text-white leading-none" x-text="user.user_metadata.full_name || 'User'"></p>
                                <p class="text-[10px] text-zinc-500 mt-1" x-text="user.email"></p>
                            </div>
                            <img :src="user.user_metadata.avatar_url || 'https://ui-avatars.com/api/?name=' + user.email" class="w-9 h-9 rounded-full border border-zinc-700">
                        </div>
                        <button @click="handleSignOut()" class="text-zinc-400 hover:text-red-400 transition"><i data-lucide="log-out" class="w-5 h-5"></i></button>
                    </div>
                </template>
            </div>
        </header>

        <!-- DASHBOARD BODY -->
        <main class="flex-1 overflow-y-auto p-8">
            <!-- Generator UI -->
            <div x-show="view === 'generator'" class="max-w-5xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8" x-transition>
                <div class="lg:col-span-5 space-y-6">
                    <div class="space-y-3">
                        <label class="text-sm font-semibold text-zinc-300">Description</label>
                        <textarea x-model="prompt" class="w-full h-40 bg-zinc-900 border border-zinc-800 rounded-2xl p-4 text-sm outline-none focus:ring-1 focus:ring-indigo-500 transition text-white" placeholder="A futuristic city in the rain..."></textarea>
                    </div>
                    <button @click="generateVideo()" :disabled="loading" class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white font-bold rounded-2xl transition shadow-xl">
                        <span x-show="!loading">Generate Video (10cr)</span>
                        <span x-show="loading">Synthesizing...</span>
                    </button>
                </div>
                <div class="lg:col-span-7">
                    <div class="relative w-full rounded-3xl border border-zinc-800 bg-zinc-900 aspect-video flex items-center justify-center overflow-hidden">
                        <div x-show="!loading && !generated" class="text-zinc-700 flex flex-col items-center">
                            <i data-lucide="video" class="w-12 h-12 mb-2 opacity-20"></i>
                            <span class="text-sm">Video Preview Window</span>
                        </div>
                        <template x-if="generated && !loading">
                            <video class="w-full h-full object-cover" autoplay loop muted src="https://assets.mixkit.co/videos/preview/mixkit-abstract-tunnel-of-blue-and-pink-neon-lights-31846-large.mp4"></video>
                        </template>
                    </div>
                </div>
            </div>

            <!-- History View -->
            <div x-show="view === 'history'" x-cloak class="max-w-5xl mx-auto" x-transition>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <template x-for="vid in videoHistory" :key="vid.id">
                        <div class="card-dark rounded-xl overflow-hidden shadow-lg">
                            <video :src="vid.url" class="w-full aspect-video object-cover" muted></video>
                            <p class="text-[10px] p-3 text-zinc-400 truncate" x-text="vid.prompt"></p>
                        </div>
                    </template>
                </div>
            </div>
        </main>
    </div>

    <!-- AUTH MODAL (Combined Login/Register) -->
    <div x-show="showAuth" x-cloak class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/90 backdrop-blur-sm">
        <div @click.away="showAuth = false" class="bg-zinc-950 border border-zinc-800 rounded-[2.5rem] max-w-md w-full p-10 relative shadow-2xl">
            <button @click="showAuth = false" class="absolute top-6 right-6 text-zinc-500 hover:text-white transition"><i data-lucide="x" class="w-5 h-5"></i></button>
            
            <h2 class="text-3xl font-bold mb-2 text-white" x-text="authMode === 'login' ? 'Welcome Back' : 'Create Account'"></h2>
            <p class="text-zinc-400 text-sm mb-8" x-text="authMode === 'login' ? 'Sign in to continue generating.' : 'Join Nova AI and start creating.'"></p>
            
            <!-- Google Button -->
            <button @click="handleGoogleLogin()" class="w-full flex items-center justify-center gap-3 bg-white text-black font-bold py-3.5 rounded-2xl hover:bg-zinc-200 transition mb-6 shadow-lg">
                <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Continue with Google
            </button>

            <div class="flex items-center gap-4 mb-6">
                <div class="h-px bg-zinc-800 flex-1"></div>
                <span class="text-[10px] text-zinc-600 font-bold uppercase">Or use email</span>
                <div class="h-px bg-zinc-800 flex-1"></div>
            </div>

            <!-- Email Form -->
            <div class="space-y-4">
                <input type="email" placeholder="Email Address" class="w-full bg-zinc-900 border border-zinc-800 p-3 rounded-xl outline-none focus:ring-1 focus:ring-indigo-500 transition text-white text-sm">
                <input type="password" placeholder="Password" class="w-full bg-zinc-900 border border-zinc-800 p-3 rounded-xl outline-none focus:ring-1 focus:ring-indigo-500 transition text-white text-sm">
                <button class="w-full py-3.5 bg-zinc-800 text-white font-bold rounded-2xl hover:bg-zinc-700 transition" x-text="authMode === 'login' ? 'Login' : 'Sign Up'"></button>
            </div>

            <p class="text-center text-xs text-zinc-500 mt-6">
                <span x-text="authMode === 'login' ? 'Don\'t have an account?' : 'Already have an account?'"></span>
                <button @click="authMode = (authMode === 'login' ? 'register' : 'login')" class="text-indigo-400 font-bold hover:underline ml-1" x-text="authMode === 'login' ? 'Sign Up' : 'Login'"></button>
            </p>
        </div>
    </div>

    <script>
        // Use a different variable name for Supabase client to avoid declaration errors
        const sbClient = supabase.createClient(
            'https://qvuwznitvqruqmkkuecl.supabase.co', 
            'sb_publishable_lrwRx5E9AzmVpHbGhHQa3A_DOnlyV05'
        );

        function novaApp() {
            return {
                view: 'generator',
                user: null,
                credits: 120,
                videoHistory: [],
                showAuth: false,
                authMode: 'login', // 'login' or 'register'
                loading: false,
                generated: false,
                prompt: '',

                async initApp() {
                    lucide.createIcons();
                    
                    // Session check
                    const { data: { session } } = await sbClient.auth.getSession();
                    this.user = session?.user || null;
                    if(this.user) this.loadLocalData();

                    // Listen for login/logout
                    sbClient.auth.onAuthStateChange((_event, session) => {
                        this.user = session?.user || null;
                        if(this.user) this.loadLocalData();
                        this.$nextTick(() => lucide.createIcons());
                    });
                },

                openAuth(mode) {
                    this.authMode = mode;
                    this.showAuth = true;
                },

                changeView(v) {
                    this.view = v;
                    this.$nextTick(() => lucide.createIcons());
                },

                loadLocalData() {
                    const saved = localStorage.getItem(`nova_${this.user.id}`);
                    if (saved) {
                        const data = JSON.parse(saved);
                        this.credits = data.credits;
                        this.videoHistory = data.history;
                    }
                },

                saveLocalData() {
                    if(!this.user) return;
                    localStorage.setItem(`nova_${this.user.id}`, JSON.stringify({
                        credits: this.credits,
                        history: this.videoHistory
                    }));
                },

                async handleGoogleLogin() {
                    await sbClient.auth.signInWithOAuth({ 
                        provider: 'google',
                        options: { redirectTo: window.location.origin }
                    });
                },

                async handleSignOut() {
                    await sbClient.auth.signOut();
                    window.location.reload();
                },

                generateVideo() {
                    if (!this.user) { this.openAuth('login'); return; }
                    if (!this.prompt) return alert('Enter a prompt!');
                    if (this.credits < 10) return alert('Out of credits!');

                    this.loading = true;
                    this.generated = false;

                    setTimeout(() => {
                        this.loading = false;
                        this.generated = true;
                        this.credits -= 10;
                        this.videoHistory.unshift({
                            id: Date.now(),
                            prompt: this.prompt,
                            url: 'https://assets.mixkit.co/videos/preview/mixkit-abstract-tunnel-of-blue-and-pink-neon-lights-31846-large.mp4',
                            timestamp: new Date()
                        });
                        this.saveLocalData();
                        this.$nextTick(() => lucide.createIcons());
                    }, 3000);
                }
            }
        }
    </script>
</body>
</html>
