<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova AI - Video Studio</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#0b0f17] text-gray-100 font-sans min-h-screen flex flex-col antialiased">

    <!-- Top Navigation Bar -->
    <header class="h-16 border-b border-gray-800 bg-[#0d121d]/80 backdrop-blur-md px-6 flex items-center justify-between sticky top-0 z-40">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30">
                ✨
            </div>
            <span class="font-bold text-lg tracking-wide text-white">Nova AI</span>
        </div>

        <div class="flex items-center gap-4">
            <!-- Logged Out UI -->
            <div id="auth-buttons" class="flex items-center gap-3">
                <button onclick="toggleModal('login-modal')" class="text-sm font-medium text-gray-300 hover:text-white px-3 py-2 rounded-lg transition">
                    Login
                </button>
                <button onclick="toggleModal('login-modal')" class="text-sm font-medium bg-white text-black hover:bg-gray-200 px-4 py-2 rounded-lg transition shadow">
                    Register
                </button>
            </div>

            <!-- Logged In UI -->
            <div id="user-profile" class="hidden flex items-center gap-3 border-l border-gray-800 pl-4">
                <img id="user-avatar" src="" alt="User Avatar" class="w-8 h-8 rounded-full border border-gray-700">
                <span id="user-name" class="text-sm font-medium text-gray-200"></span>
                <button onclick="logout()" class="text-xs text-red-400 hover:text-red-300 bg-red-500/10 hover:bg-red-500/20 px-2 py-1.5 rounded-md transition ml-2">
                    Logout
                </button>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- Sidebar -->
        <aside class="w-64 border-r border-gray-800 bg-[#0d121d] p-4 flex flex-col justify-between hidden md:flex">
            <nav class="space-y-1">
                <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-indigo-600/10 text-indigo-400 font-medium text-sm">
                    <i data-lucide="video" class="w-4 h-4"></i> Generator
                </a>
                <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:bg-gray-800/50 hover:text-gray-200 text-sm transition">
                    <i data-lucide="history" class="w-4 h-4"></i> History
                </a>
                <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:bg-gray-800/50 hover:text-gray-200 text-sm transition">
                    <i data-lucide="credit-card" class="w-4 h-4"></i> Billing
                </a>
                <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:bg-gray-800/50 hover:text-gray-200 text-sm transition">
                    <i data-lucide="settings" class="w-4 h-4"></i> Settings
                </a>
            </nav>

            <div class="p-4 rounded-xl border border-gray-800 bg-gray-900/40">
                <div class="text-xs text-gray-400 uppercase tracking-wider font-semibold mb-1">CREDITS</div>
                <div id="credit-count" class="text-2xl font-bold text-white mb-2">0</div>
                <button onclick="alert('Pricing plans coming soon!')" class="text-xs text-indigo-400 hover:underline font-medium">Upgrade Plan →</button>
            </div>
        </aside>

        <!-- Studio Dashboard -->
        <main class="flex-1 p-6 lg:p-8 overflow-y-auto">
            <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div class="lg:col-span-5 space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Prompt</label>
                        <textarea id="video-prompt" rows="5" class="w-full bg-[#131927] border border-gray-800 rounded-xl p-4 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 transition resize-none" placeholder="A cinematic drone shot of a futuristic neon city at night..."></textarea>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-gray-400 mb-2">MODEL</label>
                            <select class="w-full bg-[#131927] border border-gray-800 rounded-xl px-3 py-2.5 text-sm text-gray-200 focus:outline-none focus:border-indigo-500">
                                <option>Google Veo 3</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-400 mb-2">RATIO</label>
                            <div class="flex bg-[#131927] border border-gray-800 rounded-xl p-1">
                                <button class="flex-1 py-1.5 text-xs font-medium rounded-lg bg-gray-800 text-white">16:9</button>
                                <button class="flex-1 py-1.5 text-xs font-medium rounded-lg text-gray-400 hover:text-white">9:16</button>
                            </div>
                        </div>
                    </div>

                    <button onclick="generateVideo()" class="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm rounded-xl transition shadow-lg shadow-indigo-600/25 flex items-center justify-center gap-2">
                        <i data-lucide="sparkles" class="w-4 h-4"></i> Generate Video
                    </button>
                </div>

                <div class="lg:col-span-7">
                    <div class="w-full aspect-video bg-[#131927] border border-gray-800 rounded-2xl flex flex-col items-center justify-center p-6 relative overflow-hidden shadow-2xl">
                        <div id="player-placeholder" class="text-center space-y-3">
                            <div class="w-12 h-12 rounded-full bg-gray-800/80 border border-gray-700 flex items-center justify-center mx-auto text-gray-400">
                                <i data-lucide="video" class="w-6 h-6"></i>
                            </div>
                            <p class="text-sm text-gray-400">Preview window</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Login Modal -->
    <div id="login-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-[#131927] border border-gray-800 w-full max-w-md rounded-2xl p-6 shadow-2xl relative">
            <button onclick="toggleModal('login-modal')" class="absolute top-4 right-4 text-gray-400 hover:text-white">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            <h3 class="text-xl font-bold text-white mb-1">Welcome back</h3>
            <p class="text-sm text-gray-400 mb-6">Sign in to your account to generate AI videos.</p>
            <button onclick="signInWithGoogle()" class="w-full py-3 px-4 bg-white text-gray-900 hover:bg-gray-100 font-semibold text-sm rounded-xl transition flex items-center justify-center gap-3 shadow">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.27v3.13C3.25 21.31 7.31 24 12 24z"/>
                    <path fill="#FBBC05" d="M5.28 14.25c-.25-.72-.38-1.49-.38-2.25s.13-1.53.38-2.25V6.62H1.27C.46 8.23 0 10.06 0 12s.46 3.77 1.27 5.38l4.01-3.13z"/>
                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.25 2.69 1.27 6.62l4.01 3.13c.95-2.83 3.6-4.93 6.72-4.93z"/>
                </svg>
                Continue with Google
            </button>
        </div>
    </div>

    <!-- JavaScript Logic Start -->
    <script>
        lucide.createIcons();

        const SUPABASE_URL = "https://qvuwznitvqruqmkkuecl.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF2dXd6bml0dnFydXFta2t1ZWNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDA0NTMwMTUsImV4cCI6MjA1NjAyOTAxNX0.YOUR_ACTUAL_ANON_KEY_IF_DIFFERENT";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleOAuthRedirect() {
            if (window.location.hash && window.location.hash.includes('access_token')) {
                const hashParams = new URLSearchParams(window.location.hash.substring(1));
                const accessToken = hashParams.get('access_token');
                const refreshToken = hashParams.get('refresh_token');

                if (accessToken) {
                    const { data } = await supabaseClient.auth.setSession({
                        access_token: accessToken,
                        refresh_token: refreshToken
                    });
                    if (data?.session) {
                        window.history.replaceState({}, document.title, window.location.pathname);
                        renderLoggedInUI(data.session.user);
                    }
                }
            }
        }

        function renderLoggedInUI(user) {
            const authButtons = document.getElementById('auth-buttons');
            const userProfile = document.getElementById('user-profile');
            const userAvatar = document.getElementById('user-avatar');
            const userName = document.getElementById('user-name');
            const creditCount = document.getElementById('credit-count');

            const name = user.user_metadata?.full_name || user.user_metadata?.name || user.email.split('@')[0];
            const avatar = user.user_metadata?.avatar_url || user.user_metadata?.picture || `https://api.dicebear.com/7.x/initials/svg?seed=${name}`;

            if (authButtons) authButtons.classList.add('hidden');
            if (userProfile) userProfile.classList.remove('hidden');
            if (userName) userName.textContent = name;
            if (userAvatar) userAvatar.src = avatar;
            if (creditCount) creditCount.textContent = '100 / 100';
        }

        function renderLoggedOutUI() {
            const authButtons = document.getElementById('auth-buttons');
            const userProfile = document.getElementById('user-profile');
            const creditCount = document.getElementById('credit-count');

            if (authButtons) authButtons.classList.remove('hidden');
            if (userProfile) userProfile.classList.add('hidden');
            if (creditCount) creditCount.textContent = '0';
        }

        async function signInWithGoogle() {
            await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin
                }
            });
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.href = window.location.origin;
        }

        function toggleModal(modalId) {
            document.getElementById(modalId).classList.toggle('hidden');
        }

        function generateVideo() {
            const prompt = document.getElementById('video-prompt').value;
            const creditCount = document.getElementById('credit-count');
            
            if (creditCount.textContent === '0') {
                alert('Please login first to generate videos!');
                toggleModal('login-modal');
                return;
            }
            if (!prompt) {
                alert('Please enter a prompt!');
                return;
            }
            alert('Generating video for prompt: ' + prompt);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await handleOAuthRedirect();
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                renderLoggedInUI(session.user);
            } else {
                renderLoggedOutUI();
            }
        });

        supabaseClient.auth.onAuthStateChange((event, session) => {
            if (session) {
                renderLoggedInUI(session.user);
            } else {
                renderLoggedOutUI();
            }
        });
    </script>
    <!-- JavaScript Logic End -->
</body>
</html>
